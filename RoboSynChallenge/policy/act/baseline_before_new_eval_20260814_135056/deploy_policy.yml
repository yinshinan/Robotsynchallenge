# ACT Policy Evaluation Configuration
# python scripts/eval_policy.py --config policy/act/deploy_policy.yml

# ------------------------------------------------------------------
# Basic experiment configuration (Each policy must be retained.)
# ------------------------------------------------------------------
policy_name: act
task_name: null
setting: null
model_name: null
seed: 0
max_episodes: 20
max_steps: 1000
headless: false
pytorch_device: cuda
filter_dataset_saving: true
eval_video_log: true
eval_video_obs_keys:
  - cam_high
  - cam_right_wrist
  - cam_left_wrist
eval_reset_sync_steps: 1

# ------------------------------------------------------------------
# ACT Policy parameters used by get_model()
# ------------------------------------------------------------------
checkpoint_path: null
act_step: 10
n_action_steps: null  # null: use checkpoint value (50); set 1/2/5 for diagnosis
action_chunk_offset: 0  # diagnostic: skip leading predicted actions
state_obs_path: robot/qpos
strict_action_dim: true
neutralize_qvel: false
neutralize_left_gripper_state: false
debug_button_press: false
debug_trajectory: false
debug_trajectory_steps: 100
image_key_map:
  observation.images.cam_high: cam_high
  observation.images.cam_right_wrist: cam_right_wrist
  observation.images.cam_left_wrist: cam_left_wrist
